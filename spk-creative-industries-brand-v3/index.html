<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10162c"><meta name="robots" content="noindex,nofollow"><title>СПК ККИ — Brand & Visual Edition 3.0</title><style>html,body{margin:0;min-height:100%;background:#10162c;color:#fff;font-family:Arial}.b{min-height:100vh;display:grid;place-items:center;text-align:center}.m{width:62px;height:62px;margin:auto;border-radius:22px;background:conic-gradient(#ff654f,#ffd24d,#00a89d,#6547ff,#ff654f);animation:r 2s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="b"><div><div class="m"></div><h2>Brand & Visual Edition 3.0</h2><p>Загружаем фирменный знак, иконки и инфографику…</p></div></div><script>(async()=>{try{const fs=["payload-1.txt", "payload-2.txt"],a=(await Promise.all(fs.map(f=>fetch(f+'?v=300').then(r=>r.text())))).join(''),u=Uint8Array.from(atob(a),c=>c.charCodeAt(0)),t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="b"><h2>Ошибка загрузки</h2></div>'}})()</script></body></html>
