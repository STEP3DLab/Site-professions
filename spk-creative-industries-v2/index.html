<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a33"><meta name="robots" content="noindex,nofollow"><title>СПК культуры и креативных индустрий — Concept 0.9</title><style>html,body{margin:0;min-height:100%;background:#151a33;color:#fff;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.spin{width:54px;height:54px;margin:0 auto 18px;border:4px solid #ffffff2b;border-top-color:#cfc5ff;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.boot small{display:block;color:#c9cde0;margin-top:8px;max-width:520px;line-height:1.45}</style></head><body><div class="boot"><div><div class="spin"></div><strong>Загрузка Concept 0.9</strong><small>Автономный интерактивный прототип сайта СПК культуры и креативных индустрий</small></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw Error('Откройте сайт в актуальном Chrome, Edge, Firefox или Safari.');const a=(await Promise.all([1,2,3,4,5,6].map(i=>fetch('payload-'+i+'.txt?090').then(r=>{if(!r.ok)throw Error('Не загружена часть '+i);return r.text()})))).join('').trim(),s=atob(a),u=Uint8Array.from(s,c=>c.charCodeAt(0)),t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><strong>Не удалось открыть Concept 0.9</strong><small>'+e.message+'<br>Пожалуйста, откройте прямую ссылку GitHub Pages, а не предпросмотр файла.</small></div></div>'}})()</script></body></html>
