<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10162c"><meta name="robots" content="noindex,nofollow"><title>СПК ККИ — Creative Edition 1.2</title><style>html,body{margin:0;min-height:100%;background:#10162c;color:#fff;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.mark{width:62px;height:62px;margin:0 auto 20px;border-radius:22px;background:conic-gradient(#ff654f,#f4b92f,#00a89d,#6547ff,#ff654f);animation:r 2.2s linear infinite}.boot strong{font-size:20px}.boot small{display:block;color:#c7ccdc;margin-top:9px;max-width:520px;line-height:1.5}@keyframes r{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.mark{animation:none}}</style></head><body><div class="boot"><div><div class="mark"></div><strong>Creative Edition 1.2</strong><small>Загружаем интерактивный прототип сайта СПК культуры и креативных индустрий…</small></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw Error('Требуется актуальная версия браузера.');const files=['payload-1.txt','payload-2a.txt','payload-2b.txt','payload-3a.txt','payload-3b.txt','payload-4a.txt','payload-4b.txt'],a=(await Promise.all(files.map((f,i)=>fetch(f+'?v=122').then(r=>{if(!r.ok)throw Error('Не загружена часть '+(i+1));return r.text()})))).join('').trim(),s=atob(a),u=Uint8Array.from(s,c=>c.charCodeAt(0)),t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><strong>Не удалось открыть прототип</strong><small>'+e.message+'<br>Откройте прямую ссылку GitHub Pages или GitHack в актуальном Chrome, Edge, Firefox или Safari.</small></div></div>'}})()</script></body></html>
