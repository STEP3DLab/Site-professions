<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12182f"><title>СПК культуры и креативных индустрий — прототип</title><style>body{margin:0;background:#12182f;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.l{text-align:center;padding:30px}.m{width:54px;height:54px;border:4px solid #ffffff30;border-top-color:#bfb3ff;border-radius:50%;margin:0 auto 18px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#cbd0e2}</style></head><body><div class="l"><div class="m"></div><b>Загрузка прототипа СПК ККИ</b><br><small>Подготавливаем интерактивный интерфейс…</small></div><noscript>Для просмотра прототипа требуется JavaScript.</noscript><script>(async()=>{try{if(!('DecompressionStream'in window))throw Error('Обновите браузер');const b='https://raw.githubusercontent.com/STEP3DLab/Site-professions/main/spk-creative-industries/',a=(await Promise.all([1,2,3,4,5].map(i=>fetch(b+'payload-'+i+'.txt').then(r=>{if(!r.ok)throw Error('Ошибка загрузки данных');return r.text()})))).join('').trim(),s=atob(a),u=Uint8Array.from(s,c=>c.charCodeAt(0)),t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="l"><b>Не удалось открыть прототип</b><p>'+e.message+'</p><small>Используйте актуальную версию Chrome, Edge, Firefox или Safari.</small></div>'}})()</script></body></html>
